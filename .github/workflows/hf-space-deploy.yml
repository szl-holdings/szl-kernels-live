name: hf-space-deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: hf-space-deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 55m final-evidence deadline plus 5m runner-shutdown slack inside the 60m cap.
    timeout-minutes: 60
    steps:
      - name: Record cumulative job budget origin
        shell: bash
        run: |
          set -euo pipefail
          started_at="$(date +%s)"
          printf 'HF_JOB_STARTED_AT_EPOCH=%s\n' "$started_at" >> "$GITHUB_ENV"
          printf 'HF_TERMINAL_DEADLINE_EPOCH=%s\n' "$((started_at + 3300))" >> "$GITHUB_ENV"
      - name: Checkout exact protected-main event
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Create hash-closed isolated publisher without credentials
        run: |
          set -euo pipefail
          python -I -P -m venv "$RUNNER_TEMP/hf-publisher-venv"
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            --ignore-installed \
            -r requirements/hf-publisher.lock
      - name: Verify checked kernel contracts
        run: |
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P scripts/verify_kernel_registry.py
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P -c \
            'import pathlib,sys,unittest; root=pathlib.Path.cwd().resolve(); sys.path.insert(0,str(root)); result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover(str(root / "tests"))); raise SystemExit(not result.wasSuccessful())'
          node --test tests/test_kernel_portfolio_truth.mjs
      - name: Build source-bound Space bundle
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P scripts/build_hf_space_bundle.py \
            --output "$RUNNER_TEMP/hf-bundle" \
            --source-sha "$GITHUB_SHA" \
            > "$RUNNER_TEMP/hf-bundle-result.json"
      - name: Fetch pinned build-provenance wrapper contract before mutation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: actions/attest-build-provenance
          ref: a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
          path: .terminal-actions/attest-build-provenance
          persist-credentials: false
          fetch-depth: 1
      - name: Fetch pinned bounded attestation runtime before mutation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: actions/attest
          ref: 59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
          path: .terminal-actions/attest
          persist-credentials: false
          fetch-depth: 1
      - name: Fetch pinned bounded artifact action before mutation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: actions/upload-artifact
          ref: 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
          path: .terminal-actions/upload-artifact
          persist-credentials: false
          fetch-depth: 1
      - name: Attest deployment manifest
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: ${{ runner.temp }}/hf-bundle/hf-deploy-manifest.json
      - name: Reauthorize exact protected main before credential use
        env:
          GOVERNANCE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GOVERNANCE_TOKEN"
          test "$GITHUB_REF" = "refs/heads/main"
          operation_deadline="$((HF_TERMINAL_DEADLINE_EPOCH - 600))"
          remaining="$((operation_deadline - $(date +%s)))"
          if (( remaining <= 0 )); then
            printf 'FAIL-CLOSED: shared operation deadline expired before protected-main readback\n' >&2
            exit 1
          fi
          request_timeout=30
          if (( remaining < request_timeout )); then
            request_timeout="$remaining"
          fi
          live_sha="$(
            curl --fail --silent --show-error --connect-timeout 10 --max-time "$request_timeout" \
              --header "Authorization: Bearer $GOVERNANCE_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" \
              | python -c 'import json,sys; data=json.load(sys.stdin); data.get("protected") is True or sys.exit("main is not protected"); print(data["commit"]["sha"])'
          )"
          test "$live_sha" = "$GITHUB_SHA"
          printf 'Protected main remains exact at %s\n' "$live_sha"
      - name: Reserve full terminal-evidence budget before mutation
        id: terminal-budget
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HF_JOB_STARTED_AT_EPOCH" =~ ^[0-9]+$ ]]
          now="$(date +%s)"
          elapsed="$((now - HF_JOB_STARTED_AT_EPOCH))"
          max_pre_mutation_seconds=900
          operation_remaining="$((HF_TERMINAL_DEADLINE_EPOCH - 600 - now))"
          if (( elapsed < 0 || elapsed > max_pre_mutation_seconds )); then
            printf 'FAIL-CLOSED: pre-mutation budget exhausted after %ss\n' "$elapsed" >&2
            exit 1
          fi
          if (( operation_remaining < 1800 )); then
            printf 'FAIL-CLOSED: less than 30m remains for governed mutation and public readback\n' >&2
            exit 1
          fi
          printf 'Reserved 30m operation, 10m terminal-evidence, and 5m runner slack after %ss pre-mutation\n' "$elapsed"
      - name: Publish and measure exact protected-main bundle
        id: publish-measure
        env:
          GOVERNANCE_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN"
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P scripts/deploy_hf_space.py \
            --bundle "$RUNNER_TEMP/hf-bundle" \
            --source-sha "$GITHUB_SHA" \
            --result "$RUNNER_TEMP/hf-deploy-result.json" \
            --attestation "$RUNNER_TEMP/hf-live-attestation.json" \
            --failure-evidence "$RUNNER_TEMP/hf-deploy-failure.json"
      - name: Upload locally measured deployment evidence
        id: success-artifact
        if: steps.publish-measure.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          DEADLINE_ACTION_INPUT_NAME: hf-space-deployment-evidence
          DEADLINE_ACTION_INPUT_PATH: |
            ${{ runner.temp }}/hf-bundle/hf-deploy-manifest.json
            ${{ runner.temp }}/hf-bundle/SPACE_PROVENANCE.json
            ${{ runner.temp }}/hf-deploy-result.json
            ${{ runner.temp }}/hf-live-attestation.json
          DEADLINE_ACTION_INPUT_IF_NO_FILES_FOUND: error
          DEADLINE_ACTION_INPUT_RETENTION_DAYS: "90"
          DEADLINE_ACTION_INPUT_COMPRESSION_LEVEL: "6"
          DEADLINE_ACTION_INPUT_OVERWRITE: "false"
          DEADLINE_ACTION_INPUT_INCLUDE_HIDDEN_FILES: "false"
          DEADLINE_ACTION_INPUT_ARCHIVE: "true"
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P scripts/deploy_hf_space.py bounded-action \
            --action upload --reserve-seconds 300 --max-seconds 180
      - name: Synthesize deterministic canonical success receipt candidate
        id: candidate-receipt
        if: steps.publish-measure.outcome == 'success' && steps.success-artifact.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hf-terminal-candidate"
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P scripts/deploy_hf_space.py candidate-receipt \
            --source-sha "$GITHUB_SHA" \
            --bundle "$RUNNER_TEMP/hf-bundle" \
            --result "$RUNNER_TEMP/hf-deploy-result.json" \
            --measurement "$RUNNER_TEMP/hf-live-attestation.json" \
            --output "$RUNNER_TEMP/hf-terminal-candidate/hf-canonical-success-receipt.json"
      - name: Attest canonical final success receipt bytes
        id: oidc-receipt
        if: steps.candidate-receipt.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          NODE_OPTIONS: "--max-http-header-size=32768"
          DEADLINE_ACTION_INPUT_SUBJECT_PATH: ${{ runner.temp }}/hf-terminal-candidate/hf-canonical-success-receipt.json
          DEADLINE_ACTION_INPUT_SUBJECT_DIGEST: ""
          DEADLINE_ACTION_INPUT_SUBJECT_NAME: ""
          DEADLINE_ACTION_INPUT_SUBJECT_CHECKSUMS: ""
          DEADLINE_ACTION_INPUT_PREDICATE_TYPE: ""
          DEADLINE_ACTION_INPUT_PREDICATE: ""
          DEADLINE_ACTION_INPUT_PREDICATE_PATH: ""
          DEADLINE_ACTION_INPUT_PUSH_TO_REGISTRY: "false"
          DEADLINE_ACTION_INPUT_CREATE_STORAGE_RECORD: "true"
          DEADLINE_ACTION_GITHUB_CREDENTIAL: ${{ github.token }}
          DEADLINE_ACTION_INPUT_SHOW_SUMMARY: "true"
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P scripts/deploy_hf_space.py bounded-action \
            --action attest-build-provenance --reserve-seconds 300 --max-seconds 180
      - name: Promote attested receipt and bind separate metadata envelope
        id: finalize-receipt
        if: steps.oidc-receipt.outcome == 'success'
        continue-on-error: true
        env:
          ATTESTATION_ID: ${{ steps.oidc-receipt.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.oidc-receipt.outputs.attestation-url }}
          ATTESTATION_BUNDLE_PATH: ${{ steps.oidc-receipt.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -n "$ATTESTATION_ID"
          test -n "$ATTESTATION_URL"
          test -f "$ATTESTATION_BUNDLE_PATH"
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P scripts/deploy_hf_space.py finalize-receipt \
            --source-sha "$GITHUB_SHA" \
            --bundle "$RUNNER_TEMP/hf-bundle" \
            --result "$RUNNER_TEMP/hf-deploy-result.json" \
            --measurement "$RUNNER_TEMP/hf-live-attestation.json" \
            --candidate "$RUNNER_TEMP/hf-terminal-candidate/hf-canonical-success-receipt.json" \
            --output "$RUNNER_TEMP/hf-canonical-success-receipt.json" \
            --envelope "$RUNNER_TEMP/hf-oidc-attestation-envelope.json" \
            --attestation-id "$ATTESTATION_ID" \
            --attestation-url "$ATTESTATION_URL" \
            --bundle-path "$ATTESTATION_BUNDLE_PATH"
      - name: Upload required terminal success evidence
        id: terminal-success-artifact
        if: steps.finalize-receipt.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          DEADLINE_ACTION_INPUT_NAME: hf-space-terminal-success-evidence
          DEADLINE_ACTION_INPUT_PATH: |
            ${{ runner.temp }}/hf-canonical-success-receipt.json
            ${{ runner.temp }}/hf-oidc-attestation-envelope.json
            ${{ steps.oidc-receipt.outputs.bundle-path }}
          DEADLINE_ACTION_INPUT_IF_NO_FILES_FOUND: error
          DEADLINE_ACTION_INPUT_RETENTION_DAYS: "90"
          DEADLINE_ACTION_INPUT_COMPRESSION_LEVEL: "6"
          DEADLINE_ACTION_INPUT_OVERWRITE: "false"
          DEADLINE_ACTION_INPUT_INCLUDE_HIDDEN_FILES: "false"
          DEADLINE_ACTION_INPUT_ARCHIVE: "true"
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P scripts/deploy_hf_space.py bounded-action \
            --action upload --reserve-seconds 300 --max-seconds 180
      - name: Synthesize receipt-stage failure evidence
        id: receipt-stage-failure
        if: >-
          always() && steps.publish-measure.outcome == 'success' &&
          (steps.success-artifact.outcome != 'success' ||
          steps.candidate-receipt.outcome != 'success' ||
          steps.oidc-receipt.outcome != 'success' ||
          steps.finalize-receipt.outcome != 'success' ||
          steps.terminal-success-artifact.outcome != 'success')
        shell: bash
        run: |
          set -euo pipefail
          failure_stage="OIDC_RECEIPT_ATTESTATION"
          if [ "${{ steps.success-artifact.outcome }}" != "success" ]; then
            failure_stage="SUCCESS_ARTIFACT_UPLOAD"
          elif [ "${{ steps.candidate-receipt.outcome }}" != "success" ]; then
            failure_stage="CANDIDATE_RECEIPT_SYNTHESIS"
          elif [ "${{ steps.oidc-receipt.outcome }}" != "success" ]; then
            failure_stage="OIDC_RECEIPT_ATTESTATION"
          elif [ "${{ steps.finalize-receipt.outcome }}" != "success" ]; then
            failure_stage="FINAL_RECEIPT_PROMOTION"
          else
            failure_stage="TERMINAL_SUCCESS_ARTIFACT"
          fi
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P scripts/deploy_hf_space.py stage-failure \
            --source-sha "$GITHUB_SHA" \
            --result "$RUNNER_TEMP/hf-deploy-result.json" \
            --receipt "$RUNNER_TEMP/hf-live-attestation.json" \
            --failure-evidence "$RUNNER_TEMP/hf-receipt-stage-failure.json" \
            --failure-stage "$failure_stage" \
            --artifact-outcome "${{ steps.success-artifact.outcome }}" \
            --candidate-receipt-outcome "${{ steps.candidate-receipt.outcome }}" \
            --oidc-outcome "${{ steps.oidc-receipt.outcome }}" \
            --finalize-receipt-outcome "${{ steps.finalize-receipt.outcome }}" \
            --terminal-artifact-outcome "${{ steps.terminal-success-artifact.outcome }}" \
            --cleanup-path "$RUNNER_TEMP/hf-terminal-candidate/hf-canonical-success-receipt.json" \
            --cleanup-path "$RUNNER_TEMP/hf-canonical-success-receipt.json" \
            --cleanup-path "$RUNNER_TEMP/hf-oidc-attestation-envelope.json"
      - name: Upload receipt-stage failure evidence primary
        id: receipt-stage-failure-artifact-primary
        if: always() && steps.receipt-stage-failure.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          DEADLINE_ACTION_INPUT_NAME: hf-space-receipt-stage-failure-primary
          DEADLINE_ACTION_INPUT_PATH: ${{ runner.temp }}/hf-receipt-stage-failure.json
          DEADLINE_ACTION_INPUT_IF_NO_FILES_FOUND: error
          DEADLINE_ACTION_INPUT_RETENTION_DAYS: "90"
          DEADLINE_ACTION_INPUT_COMPRESSION_LEVEL: "6"
          DEADLINE_ACTION_INPUT_OVERWRITE: "false"
          DEADLINE_ACTION_INPUT_INCLUDE_HIDDEN_FILES: "false"
          DEADLINE_ACTION_INPUT_ARCHIVE: "true"
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P scripts/deploy_hf_space.py bounded-action \
            --action upload --reserve-seconds 60 --max-seconds 120
      - name: Retry receipt-stage failure evidence upload
        id: receipt-stage-failure-artifact-retry
        if: >-
          always() && steps.receipt-stage-failure.outcome == 'success' &&
          steps.receipt-stage-failure-artifact-primary.outcome != 'success'
        continue-on-error: true
        shell: bash
        env:
          DEADLINE_ACTION_INPUT_NAME: hf-space-receipt-stage-failure-retry
          DEADLINE_ACTION_INPUT_PATH: ${{ runner.temp }}/hf-receipt-stage-failure.json
          DEADLINE_ACTION_INPUT_IF_NO_FILES_FOUND: error
          DEADLINE_ACTION_INPUT_RETENTION_DAYS: "90"
          DEADLINE_ACTION_INPUT_COMPRESSION_LEVEL: "6"
          DEADLINE_ACTION_INPUT_OVERWRITE: "false"
          DEADLINE_ACTION_INPUT_INCLUDE_HIDDEN_FILES: "false"
          DEADLINE_ACTION_INPUT_ARCHIVE: "true"
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P scripts/deploy_hf_space.py bounded-action \
            --action upload --reserve-seconds 60 --max-seconds 120
      - name: Validate required failed-deployment receipt
        id: deployment-failure-receipt
        if: always() && steps.publish-measure.outcome == 'failure'
        continue-on-error: true
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P scripts/deploy_hf_space.py validate-deployment-failure \
            --source-sha "$GITHUB_SHA" \
            --failure-evidence "$RUNNER_TEMP/hf-deploy-failure.json"
      - name: Upload required failed-deployment receipt primary
        id: deployment-failure-artifact-primary
        if: always() && steps.publish-measure.outcome == 'failure' && steps.deployment-failure-receipt.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          DEADLINE_ACTION_INPUT_NAME: hf-space-deployment-failure-receipt-primary
          DEADLINE_ACTION_INPUT_PATH: ${{ runner.temp }}/hf-deploy-failure.json
          DEADLINE_ACTION_INPUT_IF_NO_FILES_FOUND: error
          DEADLINE_ACTION_INPUT_RETENTION_DAYS: "90"
          DEADLINE_ACTION_INPUT_COMPRESSION_LEVEL: "6"
          DEADLINE_ACTION_INPUT_OVERWRITE: "false"
          DEADLINE_ACTION_INPUT_INCLUDE_HIDDEN_FILES: "false"
          DEADLINE_ACTION_INPUT_ARCHIVE: "true"
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P scripts/deploy_hf_space.py bounded-action \
            --action upload --reserve-seconds 60 --max-seconds 120
      - name: Retry required failed-deployment receipt upload
        id: deployment-failure-artifact-retry
        if: >-
          always() && steps.publish-measure.outcome == 'failure' &&
          steps.deployment-failure-receipt.outcome == 'success' &&
          steps.deployment-failure-artifact-primary.outcome != 'success'
        continue-on-error: true
        shell: bash
        env:
          DEADLINE_ACTION_INPUT_NAME: hf-space-deployment-failure-receipt-retry
          DEADLINE_ACTION_INPUT_PATH: ${{ runner.temp }}/hf-deploy-failure.json
          DEADLINE_ACTION_INPUT_IF_NO_FILES_FOUND: error
          DEADLINE_ACTION_INPUT_RETENTION_DAYS: "90"
          DEADLINE_ACTION_INPUT_COMPRESSION_LEVEL: "6"
          DEADLINE_ACTION_INPUT_OVERWRITE: "false"
          DEADLINE_ACTION_INPUT_INCLUDE_HIDDEN_FILES: "false"
          DEADLINE_ACTION_INPUT_ARCHIVE: "true"
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P scripts/deploy_hf_space.py bounded-action \
            --action upload --reserve-seconds 60 --max-seconds 120
      - name: Upload optional failed-deployment supporting files
        if: always() && steps.publish-measure.outcome == 'failure'
        continue-on-error: true
        shell: bash
        env:
          DEADLINE_ACTION_INPUT_NAME: hf-space-deployment-failure-supporting
          DEADLINE_ACTION_INPUT_PATH: |
            ${{ runner.temp }}/hf-deploy-result.json
            ${{ runner.temp }}/hf-live-attestation.json
          DEADLINE_ACTION_INPUT_IF_NO_FILES_FOUND: warn
          DEADLINE_ACTION_INPUT_RETENTION_DAYS: "90"
          DEADLINE_ACTION_INPUT_COMPRESSION_LEVEL: "6"
          DEADLINE_ACTION_INPUT_OVERWRITE: "false"
          DEADLINE_ACTION_INPUT_INCLUDE_HIDDEN_FILES: "false"
          DEADLINE_ACTION_INPUT_ARCHIVE: "true"
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P scripts/deploy_hf_space.py bounded-action \
            --action upload --reserve-seconds 60 --max-seconds 60
      - name: Enforce terminal publication evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P scripts/deploy_hf_space.py enforce-terminal \
            --publish-outcome "${{ steps.publish-measure.outcome }}" \
            --artifact-outcome "${{ steps.success-artifact.outcome }}" \
            --candidate-receipt-outcome "${{ steps.candidate-receipt.outcome }}" \
            --oidc-outcome "${{ steps.oidc-receipt.outcome }}" \
            --finalize-receipt-outcome "${{ steps.finalize-receipt.outcome }}" \
            --terminal-artifact-outcome "${{ steps.terminal-success-artifact.outcome }}" \
            --failure-synthesis-outcome "${{ steps.receipt-stage-failure.outcome }}" \
            --failure-artifact-primary-outcome "${{ steps.receipt-stage-failure-artifact-primary.outcome }}" \
            --failure-artifact-retry-outcome "${{ steps.receipt-stage-failure-artifact-retry.outcome }}" \
            --deployment-failure-receipt-outcome "${{ steps.deployment-failure-receipt.outcome }}" \
            --deployment-failure-artifact-primary-outcome "${{ steps.deployment-failure-artifact-primary.outcome }}" \
            --deployment-failure-artifact-retry-outcome "${{ steps.deployment-failure-artifact-retry.outcome }}"
