            --measurement-artifact-outcome "${{ needs.measure.outputs.artifact_outcome }}" \
            --candidate-receipt-outcome "${{ steps.timeout-candidate.outcome }}" \
            --oidc-outcome "${{ needs.attest.result }}" \
            --finalize-receipt-outcome skipped \
            --terminal-artifact-outcome skipped \
            --cleanup-path "$RUNNER_TEMP/kernel-timeout-candidate/hf-canonical-success-receipt.json"
      - name: Preserve attestation-timeout evidence primary
        id: timeout-artifact-primary
        continue-on-error: true
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          DEADLINE_ACTION_INPUT_NAME: kernel-attestation-timeout-primary-${{ needs.authorize.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          DEADLINE_ACTION_INPUT_PATH: ${{ runner.temp }}/hf-attestation-timeout-failure.json
          DEADLINE_ACTION_INPUT_IF_NO_FILES_FOUND: error
          DEADLINE_ACTION_INPUT_RETENTION_DAYS: "1"
          DEADLINE_ACTION_INPUT_COMPRESSION_LEVEL: "6"
          DEADLINE_ACTION_INPUT_OVERWRITE: "false"
          DEADLINE_ACTION_INPUT_INCLUDE_HIDDEN_FILES: "false"
          DEADLINE_ACTION_INPUT_ARCHIVE: "true"
        shell: bash
        run: |
          cd "$RUNNER_TEMP/kernel-authorized-input"
          python -I -P scripts/deploy_hf_space.py bounded-action \
            --action upload --reserve-seconds 120 --max-seconds 60
      - name: Preserve attestation-timeout evidence retry
        id: timeout-artifact-retry
        if: steps.timeout-artifact-primary.outcome != 'success'
        continue-on-error: true
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          DEADLINE_ACTION_INPUT_NAME: kernel-attestation-timeout-retry-${{ needs.authorize.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          DEADLINE_ACTION_INPUT_PATH: ${{ runner.temp }}/hf-attestation-timeout-failure.json
          DEADLINE_ACTION_INPUT_IF_NO_FILES_FOUND: error
          DEADLINE_ACTION_INPUT_RETENTION_DAYS: "1"
          DEADLINE_ACTION_INPUT_COMPRESSION_LEVEL: "6"
          DEADLINE_ACTION_INPUT_OVERWRITE: "false"
          DEADLINE_ACTION_INPUT_INCLUDE_HIDDEN_FILES: "false"
          DEADLINE_ACTION_INPUT_ARCHIVE: "true"
        shell: bash
        run: |
          cd "$RUNNER_TEMP/kernel-authorized-input"
          python -I -P scripts/deploy_hf_space.py bounded-action \
            --action upload --reserve-seconds 60 --max-seconds 45
      - name: Enforce attestation-timeout evidence preservation
        if: always()
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_RUNTIME_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_CACHE_URL: ""
        shell: bash
        run: |
          if [ "${{ steps.timeout-failure.outcome }}" != "success" ]; then
            exit 1
          fi
          if [ "${{ steps.timeout-artifact-primary.outcome }}" != "success" ] && \
             [ "${{ steps.timeout-artifact-retry.outcome }}" != "success" ]; then
            exit 1
          fi
