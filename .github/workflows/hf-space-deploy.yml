name: hf-space-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Verify checked kernel contracts
        run: |
          python scripts/verify_kernel_registry.py
          python -m unittest discover -s tests -v
      - name: Build source-bound Space bundle
        run: |
          python scripts/build_hf_space_bundle.py \
            --output "$RUNNER_TEMP/hf-bundle" \
            --source-sha "$GITHUB_SHA" \
            > "$RUNNER_TEMP/hf-bundle-result.json"
      - name: Attest deployment manifest
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: ${{ runner.temp }}/hf-bundle/hf-deploy-manifest.json
      - name: Require approved Hugging Face credential
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: test -n "$HF_TOKEN"
      - name: Publish exact bundle
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install --disable-pip-version-check huggingface-hub==1.19.0
          python scripts/deploy_hf_space.py \
            --bundle "$RUNNER_TEMP/hf-bundle" \
            --source-sha "$GITHUB_SHA"
