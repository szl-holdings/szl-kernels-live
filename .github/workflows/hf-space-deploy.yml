name: hf-space-deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact protected-main event
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install pinned Hugging Face client without credentials
        run: python -m pip install --disable-pip-version-check huggingface-hub==1.19.0
      - name: Verify checked kernel contracts
        run: |
          python scripts/verify_kernel_registry.py
          python -m unittest discover -s tests -v
          node --test tests/test_kernel_portfolio_truth.mjs
      - name: Build source-bound Space bundle
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/build_hf_space_bundle.py \
            --output "$RUNNER_TEMP/hf-bundle" \
            --source-sha "$GITHUB_SHA" \
            > "$RUNNER_TEMP/hf-bundle-result.json"
      - name: Mint least-privilege governed ruleset reader
        id: governance-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.QILLQAQ_CLIENT_ID }}
          private-key: ${{ secrets.QILLQAQ_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: read
      - name: Require governed ruleset reader token
        env:
          GOVERNANCE_TOKEN: ${{ steps.governance-token.outputs.token }}
        run: |
          set -euo pipefail
          test -n "$GOVERNANCE_TOKEN"
      - name: Attest deployment manifest
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: ${{ runner.temp }}/hf-bundle/hf-deploy-manifest.json
      - name: Reauthorize exact protected main before credential use
        env:
          GOVERNANCE_TOKEN: ${{ steps.governance-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GOVERNANCE_TOKEN"
          test "$GITHUB_REF" = "refs/heads/main"
          live_sha="$(
            curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
              --header "Authorization: Bearer $GOVERNANCE_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" \
              | python -c 'import json,sys; data=json.load(sys.stdin); data.get("protected") is True or sys.exit("main is not protected"); print(data["commit"]["sha"])'
          )"
          test "$live_sha" = "$GITHUB_SHA"
          printf 'Protected main remains exact at %s\n' "$live_sha"
      - name: Publish exact protected-main bundle
        env:
          GOVERNANCE_TOKEN: ${{ steps.governance-token.outputs.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN"
          python scripts/deploy_hf_space.py \
            --bundle "$RUNNER_TEMP/hf-bundle" \
            --source-sha "$GITHUB_SHA" \
            --result "$RUNNER_TEMP/hf-deploy-result.json" \
            --attestation "$RUNNER_TEMP/hf-live-attestation.json" \
            --failure-evidence "$RUNNER_TEMP/hf-deploy-failure.json"
      - name: Attest final exact-revision receipt
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: ${{ runner.temp }}/hf-live-attestation.json
      - name: Upload required successful deployment evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-space-deployment-evidence
          path: |
            ${{ runner.temp }}/hf-bundle/hf-deploy-manifest.json
            ${{ runner.temp }}/hf-bundle/SPACE_PROVENANCE.json
            ${{ runner.temp }}/hf-deploy-result.json
            ${{ runner.temp }}/hf-live-attestation.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload separate failed-deployment evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-space-deployment-failure
          path: |
            ${{ runner.temp }}/hf-deploy-failure.json
            ${{ runner.temp }}/hf-deploy-result.json
            ${{ runner.temp }}/hf-live-attestation.json
          if-no-files-found: warn
          retention-days: 90
