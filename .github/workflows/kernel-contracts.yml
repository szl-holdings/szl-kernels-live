name: kernel-contracts

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "19 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checked-out revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
      - name: Prove clean hash-locked publisher runtime
        shell: bash
        run: |
          test "$(python -I -P -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = "3.12.13"
          test ! -e "$RUNNER_TEMP/hf-publisher-venv"
          python -I -P -m venv "$RUNNER_TEMP/hf-publisher-venv"
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            --ignore-installed \
            -r requirements/hf-publisher.lock
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P -c \
            'import huggingface_hub; assert huggingface_hub.__version__ == "1.19.0"'
      - name: Run fail-closed tests
        run: |
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P scripts/verify_kernel_registry.py
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P -c \
            'import pathlib,sys,unittest; root=pathlib.Path.cwd().resolve(); sys.path.insert(0,str(root)); result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover(str(root / "tests"))); raise SystemExit(not result.wasSuccessful())'
          node --test tests/test_kernel_portfolio_truth.mjs
      - name: Build source-bound Hugging Face bundle
        run: |
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P scripts/build_hf_space_bundle.py \
            --output "$RUNNER_TEMP/hf-bundle" \
            --source-sha "$(git rev-parse HEAD)"

  live-integrity:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checked-out revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
      - name: Verify live heads and file content
        run: python scripts/verify_kernel_registry.py --live
