name: kernel-contracts

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "19 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify checked contracts
        run: python scripts/verify_kernel_registry.py
      - name: Run fail-closed tests
        run: python -m unittest discover -s tests -v

  live-integrity:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify live heads and file content
        run: python scripts/verify_kernel_registry.py --live
